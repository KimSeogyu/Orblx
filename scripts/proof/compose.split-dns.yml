# W24-F split DNS proof.
# The coordinator, the router, node a, node c, and the sys DNS server share the proof network.
# The router, the zone DNS server, and the db host share the lan network.
# Node a accepts the subnet route. Node c does not accept the route.
# The nodes use the sys DNS server as the system resolver.

name: ${PROOF_PROJECT:-orblx-w24f-proof}

x-node: &node
  image: ${ORBLX_SPLIT_IMAGE:-orblx-w24f:local}
  profiles: ["nodes"]
  cap_add:
    - NET_ADMIN
    - NET_RAW
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    net.ipv4.conf.all.rp_filter: "0"
    net.ipv4.conf.default.rp_filter: "0"
  stop_grace_period: 10s

services:
  coord:
    image: ${ORBLX_SPLIT_IMAGE:-orblx-w24f:local}
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
      - --policy
      - /etc/orblx/policy.hujson
    environment:
      ORBLX_OIDC_MODE: mock
    volumes:
      - ${SPLIT_COORD_STATE:?set SPLIT_COORD_STATE}:/var/lib/orblx
      - ${SPLIT_POLICY_DIR:?set SPLIT_POLICY_DIR}:/etc/orblx:ro
    networks:
      proof:
        ipv4_address: 172.30.124.2

  tool:
    image: ${ORBLX_SPLIT_IMAGE:-orblx-w24f:local}
    profiles: ["tool"]
    entrypoint: ["orblx"]
    depends_on:
      - coord
    volumes:
      - ${SPLIT_TOOL_STATE:?set SPLIT_TOOL_STATE}:/var/lib/orblx
      - ${SPLIT_COORD_STATE:?set SPLIT_COORD_STATE}:/coord-state:ro
    networks:
      - proof

  # A long-lived tool for node a. The proof fetches the netmap here after a policy change.
  fetch-a:
    image: ${ORBLX_SPLIT_IMAGE:-orblx-w24f:local}
    profiles: ["nodes"]
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ${SPLIT_FETCH_A_STATE:?set SPLIT_FETCH_A_STATE}:/var/lib/orblx
      - ${SPLIT_COORD_STATE:?set SPLIT_COORD_STATE}:/coord-state:ro
    networks:
      - proof

  sysdns:
    image: ${ORBLX_SPLIT_IMAGE:-orblx-w24f:local}
    profiles: ["nodes"]
    entrypoint: ["python3", "-u", "/proof/split-dns-server.py", "sys", "172.30.124.53"]
    volumes:
      - ./:/proof:ro
    networks:
      proof:
        ipv4_address: 172.30.124.53

  router:
    <<: *node
    # The router writes ip_forward and iptables. The container needs a writable /proc/sys.
    privileged: true
    volumes:
      - ${SPLIT_ROUTER_STATE:?set SPLIT_ROUTER_STATE}:/var/lib/orblx
      - ${SPLIT_ROUTER_NETMAP:?set SPLIT_ROUTER_NETMAP}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --advertise-routes
      - 10.88.24.0/24
    networks:
      proof:
        ipv4_address: 172.30.124.3
      lan:
        ipv4_address: 10.88.24.2

  a:
    <<: *node
    volumes:
      - ${SPLIT_A_STATE:?set SPLIT_A_STATE}:/var/lib/orblx
      - ${SPLIT_A_NETMAP:?set SPLIT_A_NETMAP}:/etc/orblx/netmap.json:ro
      - ./resolv.split-dns.conf:/etc/resolv.conf:ro
      - ./:/proof:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --accept-routes
    networks:
      proof:
        ipv4_address: 172.30.124.4

  c:
    <<: *node
    volumes:
      - ${SPLIT_C_STATE:?set SPLIT_C_STATE}:/var/lib/orblx
      - ${SPLIT_C_NETMAP:?set SPLIT_C_NETMAP}:/etc/orblx/netmap.json:ro
      - ./resolv.split-dns.conf:/etc/resolv.conf:ro
      - ./:/proof:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
    networks:
      proof:
        ipv4_address: 172.30.124.5

  landns:
    image: ${ORBLX_SPLIT_IMAGE:-orblx-w24f:local}
    profiles: ["nodes"]
    entrypoint: ["python3", "-u", "/proof/split-dns-server.py", "lan", "10.88.24.53"]
    volumes:
      - ./:/proof:ro
    networks:
      lan:
        ipv4_address: 10.88.24.53

  db:
    image: busybox:1.36
    profiles: ["nodes"]
    command:
      - sh
      - -c
      - mkdir -p /www && echo db-ok > /www/index.html && httpd -f -p 80 -h /www
    networks:
      lan:
        ipv4_address: 10.88.24.20

networks:
  proof:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.124.0/24
          gateway: 172.30.124.1
          # Dynamic addresses stay out of the fixed node addresses.
          ip_range: 172.30.124.128/25
  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.88.24.0/24
          gateway: 10.88.24.1
          ip_range: 10.88.24.128/25
