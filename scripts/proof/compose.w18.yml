# Three Linux nodes on one bridge.
# The proof script builds the image orblx-w18:local and sets the W18_* paths.
# UDP 4431, 4432, and 4433 let a Mac reach the containers. The Mac cannot use the bridge addresses.

name: orblx-w18

services:
  node-a:
    image: orblx-w18:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${W18_STATE_A}:/var/lib/orblx
      - ${W18_NETMAP_A}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
    ports:
      - "4431:443/udp"
    stop_grace_period: 10s
    networks:
      orblx:
        ipv4_address: 172.28.18.11

  node-b:
    image: orblx-w18:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${W18_STATE_B}:/var/lib/orblx
      - ${W18_NETMAP_B}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
    ports:
      - "4432:443/udp"
    stop_grace_period: 10s
    networks:
      orblx:
        ipv4_address: 172.28.18.12

  node-c:
    image: orblx-w18:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${W18_STATE_C}:/var/lib/orblx
      - ${W18_NETMAP_C}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
    ports:
      - "4433:443/udp"
    stop_grace_period: 10s
    networks:
      orblx:
        ipv4_address: 172.28.18.13

  # W25-54 (row 54): one node with systemd as PID 1. The unit is scripts/orblxd.service.
  # The proof starts this service only in its systemd phase (profile systemd).
  node-s:
    image: orblx-w18:local
    profiles:
      - systemd
    privileged: true
    cgroup: private
    entrypoint:
      - /lib/systemd/systemd
    command: []
    environment:
      container: docker
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${W18_STATE_S:-/nonexistent}:/var/lib/orblx
      - ${W18_NETMAP_S:-/nonexistent}:/etc/orblx/netmap.json:ro
      - ${W18_UNIT:-/nonexistent}:/etc/systemd/system/orblxd.service:ro
    stop_grace_period: 20s
    networks:
      orblx:
        ipv4_address: 172.28.18.14

networks:
  orblx:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.18.0/24
          gateway: 172.28.18.1
