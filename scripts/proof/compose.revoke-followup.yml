# Revoke follow-up proof stack (W25-2).
# `docker compose up` starts only the coordinator.
# The node services use the nodes profile.
# The load service holds the state of 50 more enrolled nodes for the poll cost check.
name: orblx-w25a-revoke-followup

services:
  coord:
    image: orblx-w25a-revoke:w25
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
      - --policy
      - /var/lib/orblx/policy.hujson
    environment:
      ORBLX_OIDC_MODE: mock
    volumes:
      - orblx-w25a-rf-store:/var/lib/orblx
      - ${POLICY_FILE:?set POLICY_FILE}:/var/lib/orblx/policy.hujson:ro
    networks:
      - proof

  owner:
    image: orblx-w25a-revoke:w25
    profiles: ["nodes"]
    entrypoint: ["orblx"]
    depends_on:
      - coord
    volumes:
      - orblx-w25a-rf-store:/coord-state:ro
      - orblx-w25a-rf-owner:/var/lib/orblx
    networks:
      - proof

  a:
    image: orblx-w25a-revoke:w25
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w25a-rf-store:/coord-state:ro
      - orblx-w25a-rf-a:/var/lib/orblx
    networks:
      - proof

  b:
    image: orblx-w25a-revoke:w25
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w25a-rf-store:/coord-state:ro
      - orblx-w25a-rf-b:/var/lib/orblx
    networks:
      - proof

  c:
    image: orblx-w25a-revoke:w25
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w25a-rf-store:/coord-state:ro
      - orblx-w25a-rf-c:/var/lib/orblx
    networks:
      - proof

  load:
    image: orblx-w25a-revoke:w25
    profiles: ["nodes"]
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - coord
    volumes:
      - orblx-w25a-rf-store:/coord-state:ro
      - orblx-w25a-rf-load:/var/lib/load
    networks:
      - proof

volumes:
  orblx-w25a-rf-store:
  orblx-w25a-rf-owner:
  orblx-w25a-rf-a:
  orblx-w25a-rf-b:
  orblx-w25a-rf-c:
  orblx-w25a-rf-load:

networks:
  proof:
