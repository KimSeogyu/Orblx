# Revoke-all proof stack (W24-D).
# `docker compose up` starts only the coordinator.
# The node services use the nodes profile.
name: orblx-w24d-revoke-all

services:
  coord:
    image: orblx-w24d-revoke:w24
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
      - --policy
      - /var/lib/orblx/policy.hujson
    environment:
      ORBLX_OIDC_MODE: mock
    volumes:
      - orblx-w24d-revoke-store:/var/lib/orblx
      - ${POLICY_FILE:?set POLICY_FILE}:/var/lib/orblx/policy.hujson:ro
    networks:
      - proof

  owner:
    image: orblx-w24d-revoke:w24
    profiles: ["nodes"]
    entrypoint: ["orblx"]
    depends_on:
      - coord
    volumes:
      - orblx-w24d-revoke-store:/coord-state:ro
      - orblx-w24d-revoke-owner:/var/lib/orblx
    networks:
      - proof

  a:
    image: orblx-w24d-revoke:w24
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w24d-revoke-store:/coord-state:ro
      - orblx-w24d-revoke-a:/var/lib/orblx
    networks:
      - proof

  b:
    image: orblx-w24d-revoke:w24
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w24d-revoke-store:/coord-state:ro
      - orblx-w24d-revoke-b:/var/lib/orblx
    networks:
      - proof

  c:
    image: orblx-w24d-revoke:w24
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w24d-revoke-store:/coord-state:ro
      - orblx-w24d-revoke-c:/var/lib/orblx
    networks:
      - proof

volumes:
  orblx-w24d-revoke-store:
  orblx-w24d-revoke-owner:
  orblx-w24d-revoke-a:
  orblx-w24d-revoke-b:
  orblx-w24d-revoke-c:

networks:
  proof:
