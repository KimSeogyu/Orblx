# NAT realism proof stack (W20).
# router-a and router-b are port-restricted cone NAT (prc).
# router-c and router-d are symmetric NAT.
# The coordinator and the relay sit on the public network.
# The relay runs two STUN servers on two ports.
name: orblx-natr-proof

services:
  coord:
    image: orblx-natr:w20
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
    environment:
      ORBLX_OIDC_MODE: mock
      # The renewal case sets a short node leaf life. Empty means the default life.
      ORBLX_SVID_TTL: ${ORBLX_NATR_SVID_TTL:-}
    volumes:
      - coord:/var/lib/orblx
    networks:
      public:
        ipv4_address: 172.29.20.10

  relay:
    image: orblx-natr:w20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "orblx stun-serve --listen 0.0.0.0:3478 & orblx stun-serve --listen 0.0.0.0:3479 & exec orblx relay --udp 0.0.0.0:443 --tcp 0.0.0.0:443"
    networks:
      public:
        ipv4_address: 172.29.20.20

  router-a:
    image: orblx-natr:w20
    entrypoint: ["/bin/sh", "/nat-router.sh"]
    command: ["172.29.20.11", "10.19.21.2", "10.19.21.10", "prc"]
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./nat-router.sh:/nat-router.sh:ro
    networks:
      public:
        ipv4_address: 172.29.20.11
      lana:
        ipv4_address: 10.19.21.2

  router-b:
    image: orblx-natr:w20
    entrypoint: ["/bin/sh", "/nat-router.sh"]
    command: ["172.29.20.12", "10.19.22.2", "10.19.22.10", "prc"]
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./nat-router.sh:/nat-router.sh:ro
    networks:
      public:
        ipv4_address: 172.29.20.12
      lanb:
        ipv4_address: 10.19.22.2

  router-c:
    image: orblx-natr:w20
    entrypoint: ["/bin/sh", "/nat-router.sh"]
    command: ["172.29.20.13", "10.19.23.2", "10.19.23.10", "symmetric"]
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./nat-router.sh:/nat-router.sh:ro
    networks:
      public:
        ipv4_address: 172.29.20.13
      lanc:
        ipv4_address: 10.19.23.2

  router-d:
    image: orblx-natr:w20
    entrypoint: ["/bin/sh", "/nat-router.sh"]
    command: ["172.29.20.14", "10.19.24.2", "10.19.24.10", "symmetric"]
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./nat-router.sh:/nat-router.sh:ro
    networks:
      public:
        ipv4_address: 172.29.20.14
      land:
        ipv4_address: 10.19.24.2

  node-a:
    image: orblx-natr:w20
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - coord:/coord-state:ro
      - state-a:/var/lib/orblx
    networks:
      lana:
        ipv4_address: 10.19.21.10

  node-b:
    image: orblx-natr:w20
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - coord:/coord-state:ro
      - state-b:/var/lib/orblx
    networks:
      lanb:
        ipv4_address: 10.19.22.10

  node-c:
    image: orblx-natr:w20
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - coord:/coord-state:ro
      - state-c:/var/lib/orblx
    networks:
      lanc:
        ipv4_address: 10.19.23.10

  node-d:
    image: orblx-natr:w20
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - coord:/coord-state:ro
      - state-d:/var/lib/orblx
    networks:
      land:
        ipv4_address: 10.19.24.10

volumes:
  coord:
  state-a:
  state-b:
  state-c:
  state-d:

networks:
  public:
    ipam:
      config:
        - subnet: 172.29.20.0/24
  lana:
    ipam:
      config:
        - subnet: 10.19.21.0/24
  lanb:
    ipam:
      config:
        - subnet: 10.19.22.0/24
  lanc:
    ipam:
      config:
        - subnet: 10.19.23.0/24
  land:
    ipam:
      config:
        - subnet: 10.19.24.0/24
