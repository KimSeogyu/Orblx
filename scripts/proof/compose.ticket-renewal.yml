# W25-26 ticket renewal proof stack.
# The proof script sets TR_* values and ORBLX_SVID_TTL.
# The node services use the nodes profile.
name: ${TR_PROJECT:-orblx-w25t-tr}

x-node: &node
  image: ${TR_IMAGE:-orblx-w25t-tr:local}
  profiles: ["nodes"]
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    net.ipv4.conf.all.rp_filter: "0"
    net.ipv4.conf.default.rp_filter: "0"
  depends_on:
    - coord
  environment:
    # Node renew trace lines ("trace <epoch_ms> ...") for gate 9 of the proof.
    ORBLX_TRACE_RENEW: "1"
    # W25-42 diagnostic only: empty means off.
    ORBLX_DIAG_FILE: ${TR_DIAG_FILE:-}
    ORBLX_DIAG_TICK_MS: "10"
    # W25-42 step 2: host exports ORBLX_SOAK_TRACE=1; empty/other = off (no forward-path cost).
    ORBLX_SOAK_TRACE: ${ORBLX_SOAK_TRACE:-}
  # Names resolve from /etc/hosts. The stack does not use Docker DNS at 127.0.0.11.
  extra_hosts: &proof-hosts
    - "coord:${TR_NET:-172.28.48}.10"
    - "owner:${TR_NET:-172.28.48}.20"
    - "a:${TR_NET:-172.28.48}.11"
    - "b:${TR_NET:-172.28.48}.12"
    - "c:${TR_NET:-172.28.48}.13"

x-up: &up
  - up
  - --state-dir
  - /var/lib/orblx
  - --listen
  - 0.0.0.0:443
  - --coord
  - ${TR_NET:-172.28.48}.10:443
  - --bundle
  - /var/lib/orblx/bundle.pem
  - --coord-name
  - coord

services:
  coord:
    image: ${TR_IMAGE:-orblx-w25t-tr:local}
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
      - --policy
      - /var/lib/orblx/policy.hujson
    environment:
      ORBLX_OIDC_MODE: mock
      ORBLX_SVID_TTL: ${TR_SVID_TTL:?set TR_SVID_TTL}
    volumes:
      - coord-state:/var/lib/orblx
      - ${TR_POLICY:?set TR_POLICY}:/var/lib/orblx/policy.hujson:ro
    extra_hosts: *proof-hosts
    networks:
      proof:
        ipv4_address: ${TR_NET:-172.28.48}.10

  owner:
    <<: *node
    command: *up
    volumes:
      - coord-state:/coord-state:ro
      - owner-state:/var/lib/orblx
    networks:
      proof:
        ipv4_address: ${TR_NET:-172.28.48}.20

  a:
    <<: *node
    command: *up
    volumes:
      - coord-state:/coord-state:ro
      - a-state:/var/lib/orblx
    networks:
      proof:
        ipv4_address: ${TR_NET:-172.28.48}.11

  b:
    <<: *node
    command: *up
    volumes:
      - coord-state:/coord-state:ro
      - b-state:/var/lib/orblx
    networks:
      proof:
        ipv4_address: ${TR_NET:-172.28.48}.12

  c:
    <<: *node
    command: *up
    volumes:
      - coord-state:/coord-state:ro
      - c-state:/var/lib/orblx
    networks:
      proof:
        ipv4_address: ${TR_NET:-172.28.48}.13

volumes:
  coord-state:
  owner-state:
  a-state:
  b-state:
  c-state:

networks:
  proof:
    ipam:
      config:
        # Static addresses must stay outside ip_range.
        # Docker gives one-shot containers addresses from the start of ip_range.
        # The static addresses are coord .10, a .11, b .12, c .13, and owner .20.
        # The pool is .64-.127. It does not contain those addresses.
        - subnet: ${TR_NET:-172.28.48}.0/24
          ip_range: ${TR_NET:-172.28.48}.64/26
