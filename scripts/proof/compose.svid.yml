# Short SVID renewal proof.
# The proof script sets SVID_* paths and ORBLX_SVID_TTL.

name: orblx-svid

services:
  coord:
    image: orblx-svid:local
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
    environment:
      ORBLX_OIDC_MODE: google
      ORBLX_SVID_TTL: "120"
    volumes:
      - ${SVID_COORD_STATE}:/var/lib/orblx
    networks:
      proof:
        ipv4_address: 172.28.19.10

  node-a:
    image: orblx-svid:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${SVID_STATE_A}:/var/lib/orblx
      - ${SVID_NETMAP_A}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - 172.28.19.10:443
      - --coord-name
      - coord
    networks:
      proof:
        ipv4_address: 172.28.19.11

  node-b:
    image: orblx-svid:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${SVID_STATE_B}:/var/lib/orblx
      - ${SVID_NETMAP_B}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - 172.28.19.10:443
      - --coord-name
      - coord
    networks:
      proof:
        ipv4_address: 172.28.19.12

networks:
  proof:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.19.0/24
          gateway: 172.28.19.1
