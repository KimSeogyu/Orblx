# W25-38 deny damage proof stack.
# `docker compose up` starts only the coordinator.
# The node services use the nodes profile.
name: orblx-w25-38-deny-damage

services:
  coord:
    image: orblx-w25-38-deny:w25
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
      - --policy
      - /var/lib/orblx/policy.hujson
    environment:
      ORBLX_OIDC_MODE: mock
    volumes:
      - orblx-w25-38-dd-store:/var/lib/orblx
      - ${POLICY_FILE:?set POLICY_FILE}:/var/lib/orblx/policy.hujson:ro
    networks:
      - proof

  owner:
    image: orblx-w25-38-deny:w25
    profiles: ["nodes"]
    entrypoint: ["orblx"]
    depends_on:
      - coord
    volumes:
      - orblx-w25-38-dd-store:/coord-state:ro
      - orblx-w25-38-dd-owner:/var/lib/orblx
    networks:
      - proof

  a:
    image: orblx-w25-38-deny:w25
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w25-38-dd-store:/coord-state:ro
      - orblx-w25-38-dd-a:/var/lib/orblx
    networks:
      - proof

  b:
    image: orblx-w25-38-deny:w25
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w25-38-dd-store:/coord-state:ro
      - orblx-w25-38-dd-b:/var/lib/orblx
    networks:
      - proof

  allowed:
    image: orblx-w25-38-deny:w25
    profiles: ["nodes"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    entrypoint: ["orblx"]
    depends_on:
      - coord
    command:
      - up
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - ${COORD_ADDR:?set COORD_ADDR}
      - --bundle
      - /var/lib/orblx/bundle.pem
      - --coord-name
      - coord
    volumes:
      - orblx-w25-38-dd-store:/coord-state:ro
      - orblx-w25-38-dd-allowed:/var/lib/orblx
    networks:
      - proof

volumes:
  orblx-w25-38-dd-store:
  orblx-w25-38-dd-owner:
  orblx-w25-38-dd-a:
  orblx-w25-38-dd-b:
  orblx-w25-38-dd-allowed:

networks:
  proof:
