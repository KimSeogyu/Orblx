# W25-40: SSH logins across node SVID renewals.
# The proof script sets the SSH_RENEW_* paths and the node SVID life SSH_RENEW_TTL.
# idp is the test OIDC issuer. The coordinator reads the [oidc] section from the config file.
# Names resolve from /etc/hosts. The stack does not use Docker DNS at 127.0.0.11.

name: orblx-ssh-renew

services:
  idp:
    image: orblx-ssh-renew:local
    entrypoint: ["orblx-test-idp"]
    command: [serve, --dir, /idp, --issuer, "https://idp:8443", --listen, "0.0.0.0:8443"]
    volumes:
      - ${SSH_RENEW_IDP_DIR}:/idp
      - ${SSH_RENEW_TOKENS}:/tokens
    extra_hosts: &proof-hosts
      - "idp:172.28.19.9"
      - "coord:172.28.19.10"
      - "node-a:172.28.19.11"
      - "node-b:172.28.19.12"
    networks:
      proof:
        ipv4_address: 172.28.19.9

  coord:
    image: orblx-ssh-renew:local
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
      - --config
      - /etc/orblx/coord.toml
    environment:
      ORBLX_SVID_TTL: "${SSH_RENEW_TTL}"
    volumes:
      - ${SSH_RENEW_COORD_STATE}:/var/lib/orblx
      - ${SSH_RENEW_CONFIG}:/etc/orblx/coord.toml:ro
      - ${SSH_RENEW_IDP_CA}:/etc/orblx/idp-ca.pem:ro
    extra_hosts: *proof-hosts
    networks:
      proof:
        ipv4_address: 172.28.19.10

  node-a:
    image: orblx-ssh-renew:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${SSH_RENEW_STATE_A}:/var/lib/orblx
      - ${SSH_RENEW_NETMAP_A}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - 172.28.19.10:443
      - --coord-name
      - coord
    extra_hosts: *proof-hosts
    networks:
      proof:
        ipv4_address: 172.28.19.11

  node-b:
    image: orblx-ssh-renew:local
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${SSH_RENEW_STATE_B}:/var/lib/orblx
      - ${SSH_RENEW_NETMAP_B}:/etc/orblx/netmap.json:ro
    command:
      - up
      - --netmap
      - /etc/orblx/netmap.json
      - --state-dir
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --coord
      - 172.28.19.10:443
      - --coord-name
      - coord
    extra_hosts: *proof-hosts
    networks:
      proof:
        ipv4_address: 172.28.19.12

networks:
  proof:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.19.0/24
          gateway: 172.28.19.1
