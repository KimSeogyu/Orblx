# Coordinator proof stack.
# `docker compose up` starts only the coordinator.
# Node containers use the same image through the node-a and node-b services.
name: orblx-coord-proof

services:
  coord:
    image: orblx-coord:w18
    command:
      - coord
      - serve
      - --state
      - /var/lib/orblx
      - --listen
      - 0.0.0.0:443
      - --name
      - coord
    environment:
      ORBLX_GOOGLE_CLIENT_ID: ${ORBLX_GOOGLE_CLIENT_ID:-}
      ORBLX_OIDC_MODE: ${ORBLX_OIDC_MODE:-google}
    ports:
      - "443:443/udp"
    volumes:
      - orblx-coord-store:/var/lib/orblx
    networks:
      - proof

  node-a:
    image: orblx-coord:w18
    profiles: ["nodes"]
    entrypoint: ["orblx"]
    depends_on:
      - coord
    volumes:
      - orblx-coord-store:/coord-state:ro
      - orblx-node-a:/var/lib/orblx
    networks:
      - proof

  # W25-14b: node-a with a TUN device. It uses the node-a state, so "orblx up" can run
  # again after a TUN failure without a new enroll token.
  node-a-tun:
    image: orblx-coord:w18
    profiles: ["nodes"]
    entrypoint: ["orblx"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - coord
    volumes:
      - orblx-coord-store:/coord-state:ro
      - orblx-node-a:/var/lib/orblx
    networks:
      - proof

  node-b:
    image: orblx-coord:w18
    profiles: ["nodes"]
    entrypoint: ["orblx"]
    depends_on:
      - coord
    volumes:
      - orblx-coord-store:/coord-state:ro
      - orblx-node-b:/var/lib/orblx
    networks:
      - proof

volumes:
  orblx-coord-store:
  orblx-node-a:
  orblx-node-b:

networks:
  proof:
