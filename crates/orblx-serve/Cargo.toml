[package]
name = "orblx-serve"
description = "orblx serve and funnel. The node daemon publishes a local TCP port over HTTPS on the overlay address. Funnel publishes the same port on an outside address only after an explicit opt-in."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
orblx-audit = { path = "../orblx-audit" }
orblx-datapath = { path = "../orblx-datapath" }
orblx-identity = { path = "../orblx-identity" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }

