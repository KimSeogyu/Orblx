[package]
name = "orblx-coord"
description = "Coordinator for node enrollment, stable overlay addresses, and signed netmaps."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
orblx-datapath = { path = "../orblx-datapath" }
orblx-edge = { path = "../orblx-edge" }
orblx-identity = { path = "../orblx-identity" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.8.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=0.26.11"

[dev-dependencies]
orblx-crypto = { path = "../orblx-crypto" }
