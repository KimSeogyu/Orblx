[package]
name = "orblx-file"
description = "File send between Orblx nodes. The sender proves its node SVID. The receiver admits only senders that the signed receiver grants allow, checks the SHA-256 digest, and writes a hash chain record for each file."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
orblx-audit = { path = "../orblx-audit" }
orblx-identity = { path = "../orblx-identity" }
rand = "0.8.5"
sha2 = "0.10.8"

[dev-dependencies]
