[package]
name = "orblx-ssh"
description = "SSH server and client for Orblx. The node daemon accepts SSH on the overlay address. The client signs in with an SVID. The server does not read authorized_keys."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
orblx-audit = { path = "../orblx-audit" }
orblx-identity = { path = "../orblx-identity" }
russh = { version = "=0.54.1", default-features = false, features = ["ring"] }
serde_json = "1"
sha2 = "0.10.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
orblx-identity = { path = "../orblx-identity" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
