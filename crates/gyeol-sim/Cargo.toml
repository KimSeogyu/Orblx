[package]
name = "gyeol-sim"
description = "Local sim harness. The harness runs three level state machines and serves feed JSON."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "gyeol-sim"
path = "src/main.rs"

# This crate is the local sim harness.
# Do not add WireGuard, Headscale, or DERP crates.
# Do not add a Unix socket for the feed.

[dependencies]
axum = "0.7.9"
gyeol-audit = { path = "../gyeol-audit" }
gyeol-datapath = { path = "../gyeol-datapath" }
gyeol-edge = { path = "../gyeol-edge" }
gyeol-identity = { path = "../gyeol-identity" }
gyeol-relay = { path = "../gyeol-relay" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=0.26.11"

[dev-dependencies]
base64 = "=0.22.1"
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
rand = "=0.8.8"
rsa = { version = "=0.9.10", features = ["pem", "sha2"] }
