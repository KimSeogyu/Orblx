[package]
name = "orblx-audit"
description = "Session audit hash chain and control-plane audit hash chain. The session chain records session start, session end, and session deny. The config chain records coordinator changes."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

# This crate checks a hash chain file.
# This crate does not use the data path.

[dependencies]
hmac = "0.12"
orblx-identity = { path = "../orblx-identity" }
orblx-relay = { path = "../orblx-relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
