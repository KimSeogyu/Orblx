[package]
name = "gyeol-edge"
description = "Edge crate. This crate gathers a STUN reflexive address, brings up same-NAT direct QUIC, and falls back to the gyeol Relay."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
getrandom = "0.2.17"
gyeol-crypto = { path = "../gyeol-crypto" }
gyeol-datapath = { path = "../gyeol-datapath" }
gyeol-identity = { path = "../gyeol-identity" }
gyeol-relay = { path = "../gyeol-relay" }
serde_json = { version = "1", features = ["preserve_order"] }
