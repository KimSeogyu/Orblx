[package]
name = "orblx-test-idp"
description = "A small OIDC test issuer for CI and [C] proofs. Do not use it in production."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "orblx-test-idp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
rand = "0.8.5"
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring"] }
rsa = { version = "=0.9.10", features = ["pem", "sha2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }
