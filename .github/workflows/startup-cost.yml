# W25-21: the node start-up cost from the enroll call to the listener start on a busy runner.
# Report only: the job prints the phase times and does not apply the idle-box gate
# (ORBLX_STARTUP_REPORT_ONLY=1). The idle-box gate is scripts/proof/startup-cost.sh.
# Each shard runs the orblx-coord tests 4 times with --nocapture, as renew-soak.yml does, and
# prints the "late_peer TAG startup_ms" lines of the late-peer tests (the node start inside the
# loaded test process). In run 1, the ignored test startup_cost_runs (20 node starts) runs in
# parallel with the orblx-coord tests. There are no reruns.
name: startup-cost

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

# A pull request run cancels the previous run in this group.
# A push to the main branch keeps the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    name: startup-cost path check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.set.outputs.run }}
    steps:
      - name: Decide if startup-cost runs
        id: set
        env:
          HAS_FULL_CI: ${{ github.event.label.name == 'full-ci' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HAS_FULL_CI:=false}"
          : "${REPO:?}"
          : "${PR_NUMBER:?}"
          : "${GITHUB_OUTPUT:?}"
          # The macOS shard and the Ubuntu shards run cargo test -p orblx-coord.
          # The job runs no script. The same path rule applies to each shard.
          if [[ "${HAS_FULL_CI}" == "true" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "startup_cost_path_check run=true reason=full-ci"
            exit 0
          fi
          files_text="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          run=false
          while IFS= read -r file; do
            if [[ -z "${file}" ]]; then
              continue
            fi
            case "${file}" in
              Cargo.lock|Cargo.toml|.github/workflows/startup-cost.yml|\
              crates/orblx-agent/*|crates/orblx-audit/*|crates/orblx-coord/*|\
              crates/orblx-crypto/*|crates/orblx-datapath/*|crates/orblx-edge/*|\
              crates/orblx-identity/*|crates/orblx-relay/*|crates/orblx-test-idp/*)
                run=true
                ;;
            esac
          done <<< "${files_text}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "startup_cost_path_check run=${run} reason=paths"

  startup-cost:
    name: startup-cost ${{ matrix.os }} shard ${{ matrix.shard }}
    needs: paths
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.paths.result == 'success' && needs.paths.outputs.run == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4, 5]
        include:
          - os: macos-latest
            shard: 1
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the test
        run: cargo test -p orblx-coord --no-run

      - name: Measure the start-up cost while the orblx-coord tests run
        env:
          ORBLX_STARTUP_RUNS: "20"
          ORBLX_STARTUP_REPORT_ONLY: "1"
          ORBLX_TRACE_COORD: "1"
        run: |
          set +e  # GitHub runs this step with bash -e; the step checks each exit code itself.
          set -uo pipefail
          status=0
          for i in 1 2 3 4; do
            echo "=== startup_cost ${{ matrix.os }} shard ${{ matrix.shard }} run ${i} start $(date -u +%FT%TZ) ==="
            cargo test -p orblx-coord -- --nocapture >"load${i}.log" 2>&1 &
            load=$!
            if [[ "$i" -eq 1 ]]; then
              cargo test -p orblx-coord --lib startup_cost_runs -- --ignored --nocapture >measure.log 2>&1
              code=$?
              if kill -0 "$load" 2>/dev/null; then overlap=yes; else overlap=no; fi
              cat measure.log
              echo "startup_cost measure_exit ${code} load_running_at_measure_end ${overlap}"
              if [[ "$code" -ne 0 ]]; then status=1; fi
            fi
            wait "$load"
            load_code=$?
            grep -h '^late_peer ' "load${i}.log" | sed "s/^/startup_cost run ${i} /"
            echo "=== startup_cost run ${i} end $(date -u +%FT%TZ) load_exit ${load_code} ==="
          done
          exit "$status"
