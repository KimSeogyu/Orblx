# W25-11: run the SVID renewal session test 20 times on Linux and 20 times on macOS.
# Each shard builds once and runs the orblx-coord tests 4 times in series. A failed run fails
# the shard. The other orblx-coord tests run in parallel with the renewal test, as in ci.yml,
# so the runner has the same load as the CI test step.
# There are no reruns: 5 shards x 4 runs = 20 runs per OS.
name: renew-soak

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/orblx-datapath/src/node.rs
      - crates/orblx-datapath/src/quic.rs
      - crates/orblx-coord/src/renew_test.rs
      - .github/workflows/renew-soak.yml

jobs:
  renew-soak:
    name: renew-soak ${{ matrix.os }} shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the test
        run: cargo test -p orblx-coord --no-run

      - name: Run the orblx-coord tests with the renewal test 4 times
        env:
          ORBLX_TRACE_RENEW: "1"
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            echo "=== renew_soak ${{ matrix.os }} shard ${{ matrix.shard }} run ${i} start $(date -u +%FT%TZ) ==="
            cargo test -p orblx-coord -- --nocapture 2>&1 | tee "run${i}.log"
            grep -h '^renew_gap_summary' "run${i}.log" | sed "s/^/renew_soak run ${i} /"
          done
