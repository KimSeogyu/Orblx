name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: format, clippy, and test
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check the Rust format
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --workspace

      - name: Check the shell syntax of the release and proof scripts
        run: |
          sh -n scripts/install.sh
          bash -n scripts/release/package.sh scripts/proof/release.sh scripts/proof/release-real.sh
          bash -n scripts/proof/agent-grant.sh scripts/proof/agent-gateway.sh scripts/proof/agent-python-sdk.sh
          bash -n scripts/proof/nat-realism.sh scripts/proof/perf-watch.sh
          bash -n scripts/proof/api-tokens.sh scripts/proof/token-no-escalation.sh

      - name: Run the perf watch summary tests
        run: python3 -m unittest discover -s scripts/proof/tests -v

      - name: Run the Python agent SDK tests
        run: python3 -m unittest discover -s sdk/python/tests -v

      - name: Run the harness demo
        env:
          # Public Web client id. The secret is a stand-in. It is not a Google secret.
          ORBLX_GOOGLE_CLIENT_ID: 949089074205-hpspmac5i7uld6q5p3f019tvmojhoipi.apps.googleusercontent.com
          ORBLX_GOOGLE_CLIENT_SECRET: not-a-real-google-secret
        run: ./scripts/demo.sh

  rust-macos:
    name: macOS format, clippy, and test
    runs-on: macos-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check the Rust format
        run: cargo fmt --all -- --check

      - name: Build the workspace
        run: cargo build --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --workspace

      - name: Run the Python agent SDK tests
        run: python3 -m unittest discover -s sdk/python/tests -v
