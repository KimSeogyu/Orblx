name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: format, clippy, and test
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Check that the workspace version is not a release tag (W25-44)
        run: |
          git fetch --no-recurse-submodules --tags origin
          bash scripts/check-version-not-tagged.sh

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check the Rust format
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --workspace

      - name: Check the shell syntax of the release and proof scripts
        run: |
          sh -n scripts/install.sh
          # bash -n reads only its first file, so check each script alone.
          for script in $(git ls-files '*.sh'); do
            bash -n "$script"
          done
          sh -n docker/entrypoint.sh

      - name: Run the proof script tests (perf watch summary, early pipe readers, lock, root)
        run: python3 -m unittest discover -s scripts/proof/tests -v

      - name: Run the Python agent SDK tests
        run: python3 -m unittest discover -s sdk/python/tests -v

      - name: Run the harness demo
        env:
          # Public Web client id. The secret is a stand-in. It is not a Google secret.
          ORBLX_GOOGLE_CLIENT_ID: 949089074205-hpspmac5i7uld6q5p3f019tvmojhoipi.apps.googleusercontent.com
          ORBLX_GOOGLE_CLIENT_SECRET: not-a-real-google-secret
        run: ./scripts/demo.sh

  docker-image:
    name: Docker image build, size, and secrets scan
    runs-on: ubuntu-latest
    # CI builds the image only. CI does not push the image to a registry.
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f docker/Dockerfile -t orblx-ci:local .

      - name: Check the image size (at most 60000000 bytes)
        run: |
          size="$(docker image inspect orblx-ci:local --format '{{.Size}}')"
          echo "size_bytes ${size}"
          test "$size" -le 60000000

      - name: Check the image history for secrets
        run: |
          history="$(docker history --no-trunc --format '{{.CreatedBy}}' orblx-ci:local)"
          if grep -qE 'BEGIN|ORBLX_ENROLL_TOKEN=' <<<"$history"; then
            echo "docker history has a secret pattern." >&2
            exit 1
          fi

      - name: Scan the saved image for secrets
        run: docker save orblx-ci:local | python3 scripts/proof/image-secrets-scan.py

      - name: Check that the scan finds a planted fake PEM block (control)
        run: |
          work="$(mktemp -d)"
          python3 -c 'import base64, os; print("-----BEGIN " + "PRIVATE KEY-----\n" + base64.encodebytes(os.urandom(96)).decode() + "-----END " + "PRIVATE KEY-----")' >"$work/planted.pem"
          printf 'FROM orblx-ci:local\nCOPY planted.pem /etc/planted.pem\n' >"$work/Dockerfile"
          docker build -q -t orblx-ci-control:local "$work"
          docker save orblx-ci-control:local | python3 scripts/proof/image-secrets-scan.py --expect-hit

      - name: Check that the image runs the orblx binary
        run: docker run --rm orblx-ci:local --version

  rust-macos:
    name: macOS format, clippy, and test
    runs-on: macos-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check the Rust format
        run: cargo fmt --all -- --check

      - name: Build the workspace
        run: cargo build --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # W25-11: the renewal gap test is a gate on Linux only. On the macOS runner the OS
      # stops the test process for up to some hundred ms, so the test runs below as a report.
      - name: Run the tests
        run: cargo test --workspace -- --skip renew_test::session_stays_up_for_three_svid_lifetimes

      - name: Report the renewal gap and the probe stalls (report only, does not fail CI)
        env:
          ORBLX_TRACE_RENEW: "1"
        run: |
          set +e
          cargo test -p orblx-coord renew_test::session_stays_up_for_three_svid_lifetimes -- --exact --nocapture >renew-report.log 2>&1
          code=$?
          grep -E '^renew_gap_summary|packet gap|trace [0-9]+ test (gap|stall|os_stall)' renew-report.log
          echo "renew_gap_report macos test_exit ${code} (report only)"
          exit 0

      - name: Check the shell syntax of all shell scripts
        run: |
          for script in $(git ls-files '*.sh'); do
            bash -n "$script"
          done

      - name: Run the proof script tests (perf watch summary, early pipe readers, lock, root)
        run: python3 -m unittest discover -s scripts/proof/tests -v

      - name: Run the Python agent SDK tests
        run: python3 -m unittest discover -s sdk/python/tests -v
