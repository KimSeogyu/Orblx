[workspace]
resolver = "2"
members = [
    "crates/orblx-agent",
    "crates/orblx-audit",
    "crates/orblx-cli",
    "crates/orblx-coord",
    "crates/orblx-crypto",
    "crates/orblx-datapath",
    "crates/orblx-edge",
    "crates/orblx-file",
    "crates/orblx-identity",
    "crates/orblx-relay",
    "crates/orblx-serve",
    "crates/orblx-sim",
    "crates/orblx-ssh",
    "crates/orblx-test-idp",
]

# The data path uses Quinn, rustls, and ring.
# You can use aws-lc-rs as the crypto backend for rustls.
# Do not add WireGuard, wireguard-go, Tailscale, Headscale, or DERP crates.

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.89"
version = "0.1.0-rc.3-dev"
