[workspace]
resolver = "2"
members = [
    "crates/gyeol-cli",
    "crates/gyeol-coord",
    "crates/gyeol-crypto",
    "crates/gyeol-datapath",
    "crates/gyeol-edge",
    "crates/gyeol-identity",
    "crates/gyeol-relay",
    "crates/gyeol-sim",
]

# The data path uses Quinn, rustls, and ring.
# You can use aws-lc-rs as the crypto backend for rustls.
# Do not add WireGuard, wireguard-go, Tailscale, Headscale, or DERP crates.

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.1.0"
